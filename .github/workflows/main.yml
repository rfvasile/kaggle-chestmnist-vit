name: upload

# The source as a Kaggle Dataset, for offline kernels
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Export requirements.txt from uv.lock
        run: uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements.txt -o requirements.txt
      - name: Upload datasets
        uses: jaimevalero/push-kaggle-dataset@v3
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

        with:
          id: "rfvasile/22-aie-437-vision-transformer-from-scratch-on-chest-mnist-src"
          title: "Kaggle Chest MNIST with ViT"
          subtitle: "Config-driven pipeline"
          description: >
            The runners (train_gluon.py, train_nn.py, infer_nn.py), experiment.py, and the modules a
            config selects (configs/, data/, models/, postprocess/, metrics/).
          files:  |
                  *.py
                  models/*.py
                  data/*.py
                  configs/*.py
                  scripts/*.py
                  postprocess/*.py
                  metrics/*.py
                  requirements.txt

          is_public: true
